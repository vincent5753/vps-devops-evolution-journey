#cloud-config
# ============================================================
#  ubuntu-cloud_init-basic-harden.yaml
#  Place at:    /var/lib/vz/snippets/
#  Permissions: chmod 644 / owner root:root
#  Referenced by OpenTofu as:
#               local:snippets/ubuntu-cloud_init-basic-harden.yaml
# ============================================================
#  ⚠ Change these before using it:
#     1. users[0].ssh_authorized_keys  <- your own public keys (multiple ok)
#     2. timezone / locale (if needed)
#
#  Account created: opentofu_adm
#  Log in with:     ssh opentofu_adm@<vm-ip>
# ============================================================

# ---------- Host basics ----------
timezone: Asia/Taipei
locale: en_US.UTF-8

# ---------- Users ----------
# Note: once 'users' is defined, cloud-init no longer creates the
# default 'ubuntu' account.
users:
  - name: opentofu_adm
    gecos: "OpenTofu Automation Admin"
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true          # no password login, keys only
    ssh_authorized_keys:
      # Each key must sit on exactly one line — no wrapping.
      # Paste the whole line from ~/.ssh/id_ed25519.pub.
      # The trailing comment is free-form; use it to label the machine.
      - ssh-ed25519 AAAA_REPLACE_ME_KEY_A your@desktop
      - ssh-ed25519 AAAA_REPLACE_ME_KEY_B your@laptop

# ---------- SSH hardening ----------
disable_root: true             # no direct root login
ssh_pwauth: false              # password authentication off entirely

ssh_deletekeys: true           # drop the image's baked-in host keys, regenerate
ssh_genkeytypes: [ed25519, rsa]

# ---------- Packages ----------
package_update: true
package_upgrade: true

packages:
  - qemu-guest-agent           # required, otherwise PVE cannot read the VM's IP
  - unattended-upgrades
  - fail2ban
  - ufw
  - chrony
  - curl
  - vim

# ---------- Config files ----------
write_files:
  # Extra SSH hardening (overrides the defaults)
  - path: /etc/ssh/sshd_config.d/99-harden.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # Install security updates automatically
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

  # fail2ban jail for sshd
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 600
      bantime  = 3600

  # Keep IPv6 off in the network configuration itself, not only in sysctl.
  # The comment on the IPv6 lines in the sysctl file below explains why the
  # sysctl does not hold on its own.
  #
  # The id must be the one cloud-init itself uses (eth0), because netplan
  # merges by id: the same id extends cloud-init's own definition, while a
  # different id generates a second .network file matching the same NIC and
  # networkd silently takes whichever sorts first. Checked with `netplan
  # generate` on a throwaway VM before settling on this shape.
  #
  # This cannot close the very first boot's window — cloud-init runs after
  # networkd has already configured the link. It takes effect at the reboot
  # this file ends with, which shortens the exposure from "until Ansible
  # first runs" to "until that reboot".
  - path: /etc/netplan/51-no-ipv6.yaml
    permissions: "0600"     # netplan warns loudly about world-readable configs
    owner: root:root
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            accept-ra: false
            link-local: []

  # Kernel parameter hardening
  # The 90- prefix makes these load after the distro defaults (10-*, 50-*),
  # so these values win rather than being overridden.
  - path: /etc/sysctl.d/90-bacsi-vm-hardening.conf
    permissions: "0644"
    owner: root:root
    content: |
      # --- Network layer ---
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.tcp_syncookies = 1
      # IPv6 off by default: this LAN hands out globally routable SLAAC
      # addresses, the router does not filter inbound v6, and there is no v6
      # NAT to hide behind.
      #
      # These two are NOT enough on their own, and that was measured rather
      # than assumed: a VM built from this file came up holding a public v6
      # address while both values below read 1. systemd-networkd writes 0
      # into the per-interface disable_ipv6 so it can grant a link-local
      # address, and it runs after systemd-sysctl, so it wins. The netplan
      # file written above is what actually keeps v6 off; these stay as the
      # layer covering interfaces networkd does not manage.
      #
      # Turning v6 back on for one node therefore takes both layers. Setting
      # these to 0 in 95-node-role.conf alone will not do it.
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      # --- Kernel layer ---
      kernel.randomize_va_space = 2
      kernel.kptr_restrict = 2
      kernel.dmesg_restrict = 1
      # kernel.unprivileged_bpf_disabled left at the distro default (2):
      # writing 1 is one-way and later sysctl.d files override it silently.
      # kernel.apparmor_restrict_unprivileged_userns is NOT set here: it is a
      # per-node value (Forgejo host 1, CI runner 0), so every node declares
      # its own in 95-node-role.conf and the baseline stays silent on it.

# ---------- Run on first boot ----------
runcmd:
  # QEMU guest agent (lets PVE read the IP and shut the VM down gracefully)
  - [systemctl, enable, --now, qemu-guest-agent]

  # Firewall: deny inbound by default, only SSH is open
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, --force, enable]

  - [systemctl, enable, --now, fail2ban]
  - [sysctl, --system]
  - [systemctl, restart, ssh]

# ---------- Reboot when finished ----------
# So the kernel updates take effect. Comment out the two lines below
# if you would rather not reboot.
power_state:
  mode: reboot
  # Integer, not "+1": the string form is deprecated and leaves cloud-init
  # reporting "degraded", which buries any real warning that shows up later.
  delay: 1
  message: "cloud-init finished, rebooting"

final_message: "cloud-init finished after $UPTIME seconds"
