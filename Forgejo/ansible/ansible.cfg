# Run every command from this directory so this file wins over ~/.ansible.cfg

[defaults]
# A specific file, not the inventory/ directory: pointing at the directory
# would parse both sources and merge them. static.yml is break-glass only.
inventory          = inventory/pve.proxmox.yml
roles_path         = roles

# Points at a directory that is deliberately empty. Collections come from the
# pinned ansible distribution inside .venv, which is always searched; naming a
# path here replaces the default search list, which would otherwise include
# ~/.ansible/collections — a directory that exists on this machine and would
# silently take precedence over the pinned versions. Verified: with this set,
# `ansible-galaxy collection list` shows only the two paths inside .venv.
collections_path   = collections
host_key_checking  = True
interpreter_python = auto_silent
retry_files_enabled = False
forks              = 10

# Defaults to the macOS control node's script. Running from the Windows
# Mini PC instead? Comment this line out and uncomment the .ps1 one below —
# this file is shared/version-controlled, so that's a manual swap either way.
vault_password_file = ./bin/vault-pass.sh
# vault_password_file = ./bin/vault-pass.ps1

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
