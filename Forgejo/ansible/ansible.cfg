# Run every command from this directory so this file wins over ~/.ansible.cfg

[defaults]
# A specific file, not the inventory/ directory: pointing at the directory
# would parse both sources and merge them. static.yml is break-glass only.
inventory          = inventory/pve.proxmox.yml
roles_path         = roles
collections_path   = collections
host_key_checking  = True
interpreter_python = auto_silent
retry_files_enabled = False
forks              = 10

# To automate the vault password, copy bin/vault-pass.sh.example (or .ps1.example)
# to bin/vault-pass.sh (or vault-pass.ps1) and uncomment. Otherwise --ask-vault-pass.
# vault_password_file = ./bin/vault-pass.sh
# vault_password_file = ./bin/vault-pass.ps1

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
