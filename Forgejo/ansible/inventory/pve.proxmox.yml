# Dynamic inventory from the PVE API: no tfstate, no hand-maintained host
# list. Hosts group by the VM tags set in main.tf. The filename must end in
# .proxmox.yml. Verify with: ansible-inventory --graph
---
plugin: community.proxmox.proxmox

url: https://192.168.1.140:8006
user: AnsibleUser@pve
token_id: inventory
# Keychain, not an env var: a forgotten `export` yields a bare 401 that reads
# like broken config. Store it once with:
#   security add-generic-password -a "$USER" -s forgejo-pve-token -w
token_secret: "{{ lookup('ansible.builtin.pipe', 'security find-generic-password -a \"$USER\" -s forgejo-pve-token -w') }}"
validate_certs: false

want_facts: true          # without this the plugin does not fetch tags

# The plugin does NOT set ansible_host; without this Ansible resolves the
# bare VM name through DNS and fails. Watch this on the Stage 7 runner:
# docker0 and veth interfaces appear too, so "first IPv4" may pick wrong.
compose:
  ansible_host: >-
    (proxmox_agent_interfaces | default([]))
    | rejectattr('name', 'equalto', 'lo')
    | map(attribute='ip-addresses') | flatten
    | select('search', '^[0-9]+\.')
    | map('regex_replace', '/.*', '')
    | first

# One group per tag, no prefix, so tag 'forgejo' -> group 'forgejo',
# lining up with group_vars/forgejo/. The VMID 9000 template has no tags.
keyed_groups:
  - key: proxmox_tags_parsed
    prefix: ""
    separator: ""

# No `filters:` on purpose — keyed_groups already targets precisely, and
# untargeted hosts are harmless. One less version-dependent option.
