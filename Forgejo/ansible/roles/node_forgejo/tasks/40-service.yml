---
- name: systemd unit
  ansible.builtin.template:
    src: forgejo.service.j2
    dest: /etc/systemd/system/forgejo.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart forgejo

- name: Enable and start Forgejo
  ansible.builtin.systemd_service:
    name: forgejo
    state: started
    enabled: true
    daemon_reload: true
